<div class="layout" [class.layout--sidebar-open]="sidebarOpen()">
  <app-sidebar
    [isOpen]="sidebarOpen()"
    [sidebarVisible]="showSidebar()"
    (closeSidebar)="onCloseSidebar()"
  />
  <div class="layout__main" [class.layout__main--shifted]="showSidebar()">
    @if (showSidebar()) {
      <header class="layout__navbar">
        <button class="layout__hamburger" (click)="onToggleSidebar()" aria-label="Toggle sidebar">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <span class="layout__brand">PrepVault</span>
        <div class="layout__navbar-spacer"></div>
      </header>
    }
    <main class="layout__content">
      <router-outlet />
    </main>
  </div>
</div>
