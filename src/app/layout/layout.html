<div class="min-h-dvh bg-desk text-foreground md:flex">
  <!-- Desktop: slim icon rail -->
  <nav
    aria-label="Main"
    class="sticky top-0 z-30 hidden h-dvh w-[4.5rem] shrink-0 flex-col items-center gap-1 py-4 md:flex"
    [class.max-lg:!hidden]="noteOpen()"
  >
    <a routerLink="/notes" (click)="showNotes()" class="mb-4 grid size-10 place-items-center rounded-xl bg-foreground text-background" aria-label="PrepVault home" zTooltip="PrepVault" zPosition="right">
      <ng-icon name="lucideVault" class="text-xl" />
    </a>

    <a
      routerLink="/notes/new"
      class="mb-3 grid size-11 place-items-center rounded-full bg-primary text-primary-foreground shadow-sm transition-transform hover:scale-105 hover:shadow-md"
      aria-label="New note"
      zTooltip="New note"
      zPosition="right"
    >
      <ng-icon name="lucidePlus" class="text-xl" />
    </a>

    <ng-template #railBtn let-icon="icon" let-label="label" let-on="on">
      <span class="flex flex-col items-center gap-1">
        <span
          class="grid h-8 w-12 place-items-center rounded-lg transition-colors"
          [class]="on ? 'bg-nav-active text-nav-active-foreground' : 'text-muted-foreground group-hover:bg-muted group-hover:text-foreground'"
        >
          <ng-icon [name]="icon" class="text-lg" />
        </span>
        <span class="text-[0.6875rem] leading-none" [class.font-medium]="on" [class.text-muted-foreground]="!on">{{ label }}</span>
      </span>
    </ng-template>

    <button type="button" class="group py-1.5" (click)="showNotes()" [attr.aria-current]="active() === 'notes' ? 'page' : null">
      <ng-container *ngTemplateOutlet="railBtn; context: { icon: 'lucideLibrary', label: 'Notes', on: active() === 'notes' }" />
    </button>
    <button type="button" class="group py-1.5" (click)="showBookmarks()" [attr.aria-current]="active() === 'bookmarks' ? 'page' : null">
      <ng-container *ngTemplateOutlet="railBtn; context: { icon: 'lucideBookmark', label: 'Saved', on: active() === 'bookmarks' }" />
    </button>
    <a routerLink="/analytics" class="group py-1.5" [attr.aria-current]="active() === 'analytics' ? 'page' : null">
      <ng-container *ngTemplateOutlet="railBtn; context: { icon: 'lucideChartColumn', label: 'Progress', on: active() === 'analytics' }" />
    </a>

    <div class="mt-auto flex flex-col items-center gap-3">
      <button
        type="button"
        class="grid size-9 place-items-center rounded-full text-muted-foreground hover:bg-muted hover:text-foreground"
        [zTooltip]="themeService.isDark() ? 'Light mode' : 'Dark mode'"
        zPosition="right"
        (click)="themeService.toggle()"
        [attr.aria-label]="themeService.isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
      >
        <ng-icon [name]="themeService.isDark() ? 'lucideSun' : 'lucideMoon'" class="text-lg" />
      </button>
      <button type="button" class="rounded-full outline-none focus-visible:ring-3 focus-visible:ring-ring/50" z-dropdown [zDropdownMenu]="userMenu" aria-label="Account menu">
        <z-avatar [zSrc]="user().avatar" [zFallback]="user().initial" [zAlt]="user().name" class="size-9" />
      </button>
    </div>
  </nav>

  <main class="min-w-0 flex-1 pb-16 md:pb-0" [class.max-md:!pb-0]="noteOpen()">
    <router-outlet />
  </main>

  <!-- Mobile: bottom tab bar (hidden while a note is open full-screen) -->
  @if (!noteOpen()) {
    <nav aria-label="Main" class="fixed inset-x-0 bottom-0 z-30 border-t bg-background/95 pb-[env(safe-area-inset-bottom)] backdrop-blur md:hidden">
      <div class="mx-auto grid h-16 max-w-md grid-cols-5 items-center">
        <button type="button" class="group" (click)="showNotes()">
          <ng-container *ngTemplateOutlet="railBtn; context: { icon: 'lucideLibrary', label: 'Notes', on: active() === 'notes' }" />
        </button>
        <button type="button" class="group" (click)="showBookmarks()">
          <ng-container *ngTemplateOutlet="railBtn; context: { icon: 'lucideBookmark', label: 'Saved', on: active() === 'bookmarks' }" />
        </button>
        <a routerLink="/notes/new" class="mx-auto -mt-6 grid size-14 place-items-center rounded-full bg-primary text-primary-foreground shadow-lg" aria-label="New note">
          <ng-icon name="lucidePlus" class="text-2xl" />
        </a>
        <a routerLink="/analytics" class="group">
          <ng-container *ngTemplateOutlet="railBtn; context: { icon: 'lucideChartColumn', label: 'Progress', on: active() === 'analytics' }" />
        </a>
        <button type="button" class="mx-auto rounded-full" z-dropdown [zDropdownMenu]="userMenu" aria-label="Account menu">
          <z-avatar [zSrc]="user().avatar" [zFallback]="user().initial" [zAlt]="user().name" class="size-8" />
        </button>
      </div>
    </nav>
  }

  <z-dropdown-menu-content #userMenu="zDropdownMenuContent" zSide="right" zAlign="end" class="w-64">
    <div class="flex items-center gap-3 px-2 py-2">
      <z-avatar [zSrc]="user().avatar" [zFallback]="user().initial" [zAlt]="user().name" class="size-10" />
      <div class="min-w-0">
        <p class="truncate text-sm font-medium">{{ user().name }}</p>
        <p class="truncate text-xs text-muted-foreground">{{ user().email }}</p>
      </div>
    </div>
    <z-dropdown-menu-separator />
    <z-dropdown-menu-item class="md:hidden" (click)="themeService.toggle()">
      <ng-icon [name]="themeService.isDark() ? 'lucideSun' : 'lucideMoon'" />
      {{ themeService.isDark() ? 'Light mode' : 'Dark mode' }}
    </z-dropdown-menu-item>
    <z-dropdown-menu-item (click)="signOut()">
      <ng-icon name="lucideLogOut" />
      Sign out
    </z-dropdown-menu-item>
  </z-dropdown-menu-content>
</div>
