<div class="form-page">
  <div class="form-page__header">
    <button class="form-page__back" (click)="goBack()"><svg lucideArrowLeft></svg> Back</button>
    <h1 class="form-page__title">{{ isEditing ? 'Edit Note' : 'Add Note' }}</h1>
  </div>

  @if (loading) {
    <app-form-skeleton />
  } @else {
    <form class="form" [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form__layout">
        <div class="form__main">
          <div class="form__field">
            <label class="form__label" for="title">Title *</label>
            <input
              id="title"
              class="form__input form__input--title"
              type="text"
              formControlName="title"
              placeholder="Write suitable title for the note"
            />
          </div>

          <div class="form__field">
            <label class="form__label">Category *</label>
            <div class="form__pills">
              @for (cat of categories; track cat.id) {
                <button
                  type="button"
                  class="form__pill form__pill--cat"
                  [class.--active]="form.value.category_id === cat.id"
                  (click)="selectCategory(cat.id)"
                >
                  <app-category-icon [icon]="cat.icon" />
                  <span>{{ cat.name }}</span>
                </button>
              }
            </div>
          </div>

          <div class="form__field form__field--content">
            <label class="form__label">Content</label>
            <app-markdown-editor
              [value]="form.get('body_markdown')?.value ?? ''"
              (valueChange)="onMarkdownChange($event)"
            />
          </div>
        </div>

        <aside class="form__sidebar">
          <div class="form__confidence-card">
            <div class="form__confidence-header">
              <svg lucideBrain></svg>
              <span>Confidence Level</span>
            </div>
            <p class="form__confidence-desc">How well do you know this topic?</p>
            <div class="form__confidence">
              @for (level of confidenceLevels; track level.value) {
                <label class="form__radio" [class.--active]="form.value.confidence_level === level.value" [style.--dot-color]="confidenceColors[level.value]">
                  <input
                    type="radio"
                    formControlName="confidence_level"
                    [value]="level.value"
                  />
                  <span class="form__radio-dot"></span>
                  <div class="form__radio-body">
                    <span class="form__radio-label">{{ level.label }}</span>
                    <span class="form__radio-desc">{{ level.desc }}</span>
                  </div>
                </label>
              }
            </div>
          </div>
        </aside>
      </div>

      @if (error) {
        <div class="form__error">{{ error }}</div>
      }

      <div class="form__sticky-bar">
        <div class="form__actions">
          <button type="button" class="form__btn form__btn--secondary" (click)="goBack()">
            Cancel
          </button>
          <button
            type="submit"
            class="form__btn form__btn--primary"
            [disabled]="form.invalid || submitting"
          >
            {{ submitLabel() }}
          </button>
        </div>
      </div>
    </form>
  }
</div>
