<div class="auth">
  <div class="auth__card">
    <div class="auth__header">
      <svg lucideVault class="auth__logo-icon"></svg>
      <h1 class="auth__logo">PrepVault</h1>
      <p class="auth__subtitle">Sign in to your account</p>
    </div>

    <form class="auth__form" (ngSubmit)="onSubmit()">
      <div class="auth__field">
        <label class="auth__label" for="email">Email</label>
        <div class="auth__input-wrap">
          <svg lucideMail class="auth__input-icon"></svg>
          <input
            id="email"
            class="auth__input auth__input--icon"
            type="email"
            [(ngModel)]="email"
            name="email"
            placeholder="you@example.com"
            required
            autocomplete="email"
          />
        </div>
      </div>

      <div class="auth__field">
        <label class="auth__label" for="password">Password</label>
        <div class="auth__input-wrap">
          <svg lucideLock class="auth__input-icon"></svg>
          <input
            id="password"
            class="auth__input auth__input--icon"
            [type]="passwordVisible ? 'text' : 'password'"
            [(ngModel)]="password"
            name="password"
            placeholder="Enter your password"
            required
            autocomplete="current-password"
          />
          <button
            type="button"
            class="auth__eye"
            (click)="passwordVisible = !passwordVisible"
            [attr.aria-label]="passwordVisible ? 'Hide password' : 'Show password'"
          >
            @if (passwordVisible) {
              <svg lucideEyeOff></svg>
            } @else {
              <svg lucideEye></svg>
            }
          </button>
        </div>
      </div>

      @if (error) {
        <div class="auth__error">
          <svg lucideAlertCircle></svg>
          <span>{{ error }}</span>
        </div>
      }

      <button
        class="auth__submit"
        type="submit"
        [disabled]="loading || !email || !password"
      >
        @if (loading) {
          <svg lucideLoader class="auth__spinner"></svg>
        }
        <svg lucideLogIn></svg>
        <span>{{ loading ? 'Signing in...' : 'Sign In' }}</span>
      </button>
    </form>
  </div>
</div>
