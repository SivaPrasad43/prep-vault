@if (open()) {
  <div class="fixed inset-0 z-50 grid place-items-center bg-black/50 p-4 animate-in fade-in-0" (click)="onOverlayClick()">
    <div
      class="w-full max-w-sm rounded-xl border bg-popover p-6 text-popover-foreground shadow-lg animate-in zoom-in-95"
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="title()"
      (click)="$event.stopPropagation()"
    >
      <div class="flex items-start justify-between gap-4">
        <h2 class="text-lg font-medium">{{ title() }}</h2>
        @if (closable()) {
          <button
            type="button"
            class="-m-1 grid size-8 place-items-center rounded-full text-muted-foreground hover:bg-muted"
            (click)="close.emit()"
            aria-label="Close"
          >
            <ng-icon name="lucideX" />
          </button>
        }
      </div>
      <div class="mt-2 text-sm text-muted-foreground">
        <ng-content />
      </div>
      <div class="mt-6 flex justify-end gap-2">
        <ng-content select="[modal-actions]" />
      </div>
    </div>
  </div>
}
