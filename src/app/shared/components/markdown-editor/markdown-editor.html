<div class="md-editor" [class.md-editor--preview]="showPreview()">
  <div class="md-editor__toolbar">
    <button type="button" class="md-editor__btn" (click)="toggleBold()" title="Bold (Ctrl+B)" tabindex="-1">
      <svg lucideBold></svg>
    </button>
    <button type="button" class="md-editor__btn" (click)="toggleItalic()" title="Italic (Ctrl+I)" tabindex="-1">
      <svg lucideItalic></svg>
    </button>
    <span class="md-editor__sep"></span>
    <button type="button" class="md-editor__btn" (click)="toggleHeading1()" title="Heading 1" tabindex="-1">
      <svg lucideHeading1></svg>
    </button>
    <button type="button" class="md-editor__btn" (click)="toggleHeading2()" title="Heading 2" tabindex="-1">
      <svg lucideHeading2></svg>
    </button>
    <button type="button" class="md-editor__btn" (click)="toggleHeading3()" title="Heading 3" tabindex="-1">
      <svg lucideHeading3></svg>
    </button>
    <span class="md-editor__sep"></span>
    <button type="button" class="md-editor__btn" (click)="toggleLink()" title="Link (Ctrl+K)" tabindex="-1">
      <svg lucideLink></svg>
    </button>
    <button type="button" class="md-editor__btn" (click)="toggleCode()" title="Inline Code" tabindex="-1">
      <svg lucideCode></svg>
    </button>
    <button type="button" class="md-editor__btn" (click)="toggleCodeBlock()" title="Code Block" tabindex="-1">
      <svg lucideFileCode></svg>
    </button>
    <span class="md-editor__sep"></span>
    <button type="button" class="md-editor__btn" (click)="toggleUnorderedList()" title="Bullet List" tabindex="-1">
      <svg lucideList></svg>
    </button>
    <button type="button" class="md-editor__btn" (click)="toggleOrderedList()" title="Numbered List" tabindex="-1">
      <svg lucideListOrdered></svg>
    </button>
    <button type="button" class="md-editor__btn" (click)="toggleBlockquote()" title="Blockquote" tabindex="-1">
      <svg lucideQuote></svg>
    </button>
    <span class="md-editor__sep"></span>
    <button
      type="button"
      class="md-editor__btn md-editor__btn--preview"
      [class.--active]="showPreview()"
      (click)="togglePreview()"
      title="Toggle Preview"
      tabindex="-1"
    >
      @if (showPreview()) {
        <svg lucideEyeClosed></svg>
      } @else {
        <svg lucideEye></svg>
      }
    </button>
  </div>

  <div class="md-editor__body">
    <textarea
      #editor
      class="md-editor__textarea"
      (input)="onInput($event)"
      (keydown)="onKeydown($event)"
      placeholder="Write your notes in markdown..."
    ></textarea>

    @if (showPreview()) {
      <div class="md-editor__preview">
        @if (isPreviewLoading()) {
          <div class="md-editor__preview-loading">Rendering...</div>
        } @else {
          <div class="md-editor__preview-content" [innerHTML]="renderedHtml()"></div>
        }
      </div>
    }
  </div>
</div>
