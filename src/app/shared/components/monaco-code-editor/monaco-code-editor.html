@if (loading()) {
  <div class="monaco-loading">
    <div class="monaco-loading__spinner"></div>
  </div>
}
<div
  #editorContainer
  class="monaco-editor-container"
  [class.monaco-editor-container--hidden]="loading()"
  [class.monaco-editor-container--readonly]="readonly() && !fullscreen()"
></div>
