<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PrepVault</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script>
    // Apply saved theme before first paint (no flash). Mirrors ThemeService.
    try {
      // Light by default; dark only when the user chose it (key matches ThemeService).
      if (localStorage.getItem('prep-vault-theme-v2') === 'dark') document.documentElement.classList.add('dark');
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
